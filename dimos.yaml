title: G1 Ctrl
spec-version: v1.0 # the dimos.yaml spec version this file follows
caches:
  - url: 'https://dimos-desktop.cachix.org'
    key: 'dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ='
provides:
  openapi: 3.1.0
  info:
    title: G1 Ctrl
    version: 1.0.0
    description: >-
      G1 Ctrl: drive and monitor a Unitree G1 humanoid from its onboard Jetson — modes, postures, gestures, driving, E-STOP,
      the RealSense camera, the MID360 lidar and telemetry
    x-when: you need to drive or monitor a Unitree G1 humanoid robot
  # what its server answers only its own pages (its paths: below are the public API)
  x-private:
    - api/events/*
    - api/state/*
    - api/camera/*
    - api/lidar/*
    - api/settings/*
    - api/simulator/*
    - api/scan
    - api/ui/*
    - api/joy
  paths:
    /api/state:
      get:
        description: >-
          The robot right now: link, devices (claimed/connected), mode, loco FSM, battery, attitude, hottest motor, overheat
          warning, joint positions, lidar summary, drive settings
        x-when: you want the robot's mode, battery, motor heat or link status
        x-dimos-role: context
    /api/platform:
      get:
        description: >-
          Whether this machine is the G1's onboard Jetson (jetson), plus its os, arch and device-tree model, and overridden
          (G1_ONBOARD=1/0 forced jetson). G1 Ctrl only reaches the robot from the Jetson; elsewhere the panel shows a setup
          guide instead.
        x-when: you need to know whether this app runs on the G1's own Jetson
    /api/commands:
      get:
        description: >-
          Every mode/posture/gesture command for api/command, worded for the current mode: what mode it puts the robot in,
          whether it's dangerous (needs confirm), and why it's blocked right now (if it is). Returns {mode, commands: [{id,
          label, mode, danger, blocked, title, active, ...}]}
        x-when: you want the commands the robot can run now, and which are blocked
    /api/command:
      post:
        description: >-
          Run a robot command by id (see api/commands): stiffen, walk, collapse, wave, shake, squat, standup, sit, zerotorque,
          stand, primitive-walk-slow, primitive-walk-fast, wave-turn, release-arms, high-stand, low-stand. MOVES THE ROBOT.
          Dangerous ones (danger red/amber) need confirm: true. Returns {ok, sent, command, label, mode (the mode it leads
          to)}; 409 if blocked in the current mode or dangerous without confirm; 503 if the robot's helper isn't connected.
        x-when: you need the robot to change mode, posture or do a gesture
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    type: string
                    description: the command id
                  confirm:
                    type: boolean
                    description: 'required for dangerous commands: the robot may fall or self-balance'
                  dryRun:
                    type: boolean
                    description: validate and return what would be sent, without touching the robot
                required:
                  - command
    /api/move:
      post:
        description: >-
          Drive: body velocity (vx forward m/s, vy left m/s, omega counter-clockwise rad/s). MOVES THE ROBOT. The robot stops
          on its own ~0.4 s after the last move, so either repeat it (the panel sends 15/s) or pass durationMs (≤ 5000) and
          the backend holds it that long, then stops. Needs mode walk or primitive_walk (else it is sent with a warning).
          Returns {ok, sent, durationMs, warning?}; 409 while the overheat warning is up (POST api/overheat/ack).
        x-when: 'you need to drive the robot: walk forward, sideways or turn'
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  vx:
                    type: number
                    description: m/s, |vx| ≤ 1.92
                  vy:
                    type: number
                    description: m/s, |vy| ≤ 1.28
                  omega:
                    type: number
                    description: rad/s, |omega| ≤ 4.00
                  durationMs:
                    type: number
                    description: hold this velocity for this long, then stop (max 5000)
                  dryRun:
                    type: boolean
                    description: validate and return what would be sent, without touching the robot
    /api/estop:
      post:
        description: >-
          E-STOP: abort any sequence, zero velocity and damp immediately (the robot goes limp). Always allowed. Returns {ok,
          sent}.
        x-when: the robot must stop right now, whatever it is doing
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun:
                    type: boolean
                    description: validate and return what would be sent, without touching the robot
    /api/lidar:
      put:
        description: >-
          Claim (connected: true) or release the MID360 lidar. It's exclusive: while claimed, other programs (e.g. a SLAM
          stack) can't use it. Returns {ok, sent}.
        x-when: you need lidar data, or must free the lidar for another program
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    description: true claims the lidar, false releases it
                  dryRun:
                    type: boolean
                    description: validate and return what would be sent, without touching the robot
                required:
                  - connected
    /api/camera:
      put:
        description: >-
          Claim (connected: true) or release the RealSense color camera. Exclusive: on a stock G1 Unitree's videohub holds
          it — see api/camera/takeover. Returns {ok, sent}.
        x-when: you need the camera turned on (or off) before viewing it
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
                    description: true claims the camera, false releases it
                  dryRun:
                    type: boolean
                    description: validate and return what would be sent, without touching the robot
                required:
                  - connected
    /api/camera/takeover:
      post:
        description: >-
          Force the camera free: stop Unitree's master_service and its videohub_pc4 (which hold the RealSense from boot),
          then claim it. The robot doesn't move, but its own video app loses the camera until `sudo systemctl start master_service`.
          Needs the sudoers rules in the README. Returns {stopped, message}; 403 if it couldn't stop them.
        x-when: turning the camera on fails because Unitree's videohub holds it
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  dryRun:
                    type: boolean
                    description: validate and return what would be sent, without touching the robot
    /api/camera/stream:
      put:
        description: >-
          Tune the camera stream: maxFps caps the frame rate (0 = uncapped), quality pins JPEG quality (0 = adapt to the link).
          Give either or both. Returns {ok, sent}.
        x-when: the camera feed is too slow, laggy or low quality
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  maxFps:
                    type: number
                    description: 0-60, 0 = uncapped
                  quality:
                    type: number
                    description: 0-100, 0 = adaptive
      get:
        description: >-
          The live camera as an MJPEG stream (multipart/x-mixed-replace; each part has an X-Timestamp in ms) — for the page;
          agents want api/camera/snapshot
        x-when: a page needs the continuous live camera video
    /api/camera/snapshot:
      get:
        description: >-
          What the robot's camera sees now, as one JPEG image; 503 if the camera isn't connected (PUT api/camera)
        x-when: you want to see what the robot's camera sees
        x-dimos-role: view
    /api/lidar/cloud:
      get:
        description: >-
          The MID360 point cloud accumulated over the last ~4 s, robot frame (z up, already flipped for the G1's upside-down
          mount). Returns {points (count), nearest (m to the nearest obstacle, or null), ageMs, cloud (flat [x,y,z,…] in meters)};
          404 before any lidar data (PUT api/lidar first)
        x-when: you want the lidar point cloud or the nearest obstacle's distance
    /api/settings:
      get:
        description: >-
          Drive settings: full-stick linear speed (m/s) and turn speed (rad/s) the panel's keys/pad use, and the robot IP
          used to view its camera from a remote session: {linearSpeed, turnSpeed, robotIp}
        x-when: you want the drive speeds or robot IP the panel uses
      put:
        description: >-
          Change drive settings (any subset); reset: true restores the default speeds first. Every open page updates. Returns
          the new settings {linearSpeed, turnSpeed, robotIp}; 400 if a value is out of range
        x-when: you need to change the panel's drive speeds or the robot IP
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  linearSpeed:
                    type: number
                    description: m/s, 0.1-1.2
                  turnSpeed:
                    type: number
                    description: rad/s, 0.2-2.5
                  robotIp:
                    type: string
                    description: the Jetson running G1 Ctrl, for a remote session's camera view
                  reset:
                    type: boolean
                    description: restore the default speeds
    /api/log:
      get:
        summary: 'Recent helper log lines and errors, newest last: {lines: [{at (ISO time), level, message}]}'
        x-when: something failed and you want the helper's recent log
        parameters:
          - name: limit
            in: query
            schema:
              type: number
            description: how many (default 50, max 200)
    /api/simulator:
      put:
        description: >-
          Run against a built-in simulated G1 instead of the real helper (demos and testing with no robot). Refused (409)
          while a real helper is connected. Returns {simulator (whether it's running)}.
        x-when: you want to demo or test without a real robot
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: true starts the simulated G1, false stops it
                required:
                  - enabled
    /api/squat:
      post:
        description: >-
          A CONTROLLED squat down (LocoClient FSM 706: the robot crouches onto its own legs under its controller) — the overheat
          warning's default action. MOVES THE ROBOT. Zeroes the velocity first. Refused unless the robot is up on its legs
          (walk, primitive_walk, stand, stiffen) with the 'ai' motion service resident and no sequence running, so it never
          damps or stands a squatting robot up. Returns {ok, sent}; 409 with the reason when refused.
        x-when: the robot should crouch down safely, e.g. a motor is overheating
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  why:
                    type: string
                    description: what asked for it, for the log (e.g. overheat, gamepad)
                  dryRun:
                    type: boolean
                    description: validate and return what would be sent, without touching the robot
    /api/overheat/ack:
      post:
        description: >-
          Acknowledge the overheat warning (a motor at 75°C or more): silences it and lets driving resume; it comes back 5°C
          hotter, or at 75°C again once the motors cool to 70°C. Returns {acknowledged, warning, afterMs}, or {acknowledged:
          false, note} when no warning is up
        x-when: the overheat warning is up and you've dealt with it
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  how:
                    type: string
                    description: how it was answered, for the log (e.g. dismissed, squat)
    /api/overheat/simulate:
      post:
        description: >-
          Simulator only: make the simulated G1's hottest motor read celsius (default 76), to try the overheat warning and
          the motor-temperature badge; celsius: 0 puts it back to normal. Returns {ok, celsius}; 409 when not running the
          simulator
        x-when: you want to try the overheat warning in the simulator
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  celsius:
                    type: number
                    description: '°C (0: back to the simulated normal)'
    /api/ui/press:
      post:
        description: >-
          For pages: a button the user pressed (its data-ui id): logged to g1-ctrl.log, published as a ui_press event and
          written to the recording's /logs. Returns {ok}.
        x-when: a page needs to log a button the user pressed
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: the button's id (data-ui), e.g. control.record
                  label:
                    type: string
                    description: its visible text or title, when that says more
                required:
                  - id
    /api/joy:
      post:
        description: >-
          For pages: the raw gamepad (axes, then the triggers' travel; buttons 0/1) on every change — recorded on /joystick
          while a recording runs, never driven from. Returns {ok}.
        x-when: a page needs to record the raw gamepad state
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  axes:
                    type: array
                    description: 'numbers: the sticks'' axes, then the triggers'' travel (first 32 kept)'
                  buttons:
                    type: array
                    description: 0 or 1 per button (first 32 kept)
                required:
                  - axes
                  - buttons
    /api/camera/video_note:
      post:
        description: >-
          For pages: why the camera view didn't start or stopped (or that it recovered) — logged, published as a video_note
          event and written to the recording's /logs. Returns {ok}.
        x-when: a page needs to log why its camera view failed or recovered
        requestBody:
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    type: string
                    description: what happened
                required:
                  - note
    /api/record:
      get:
        description: >-
          The recording in progress: {active: true, file, path, startedAt (ms), seconds, bytes, messages, lidarSilentS (seconds
          the lidar has been silent, or null)}; or {active: false}
        x-when: you want to know whether a recording is running, and its size
    /api/record/start:
      post:
        description: >-
          Record to an .mcap in Desktop's recordings folder (g1/<date>_<time>_g1_<host>.mcap): state (IMU, joints, battery,
          hottest motor), loco FSM, lidar, camera, velocities sent, commands, gamepad, and /logs (presses, notices, overheat,
          health, Wi-Fi). Only ever started by a request like this one; it runs until api/record/stop or the app quits. Returns
          its status (as GET api/record); if one is already running, that one's.
        x-when: you need to record the robot's data to an mcap file
    /api/record/stop:
      post:
        description: >-
          Stop the recording and finish its file: {active: false, stopped: true, file, bytes}, or {active: false, stopped:
          false} if none was running
        x-when: you need to stop the recording in progress
    /api/recordings:
      get:
        description: >-
          This app's recordings: {directory, recordings: [{file, bytes, modified (ISO time), recording (still being written)}]},
          newest first
        x-when: you want the list of this app's recording files
# prebuilt cross builds Desktop downloads (if a cache above has them) before building dimosApp, per machine type
nix:
  cache:
    aarch64-linux:
      - packages.aarch64-darwin.dimosApp-aarch64-linux
      - packages.x86_64-linux.dimosApp-aarch64-linux
    x86_64-linux:
      - packages.aarch64-darwin.dimosApp-x86_64-linux
